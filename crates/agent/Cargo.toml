[package]
name = "ameleo-display-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows guest agent for QEMU D-Bus displays: peer-to-peer D-Bus over virtio-serial"

[[bin]]
name = "ameleo-display-agent"
path = "src/main.rs"

[dependencies]
proto.workspace = true
zbus = { workspace = true, features = ["tokio"] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
async-trait = "0.1"
png = "0.18"
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
vcam-shm = { path = "../vcam-shm" }
windows-core = "0.62"
windows-collections = "0.3"

# Media Foundation for the virtual cameras and their H.264 decoders.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Foundation",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_UI_Shell",
]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
]
