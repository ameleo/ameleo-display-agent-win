version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The windows crates only build together, at the same release.
      windows:
        patterns:
          - "windows"
          - "windows-*"
    ignore:
      # windows-core, windows-collections and windows-future are at 0.100,
      # but the windows crate is still at 0.62, which needs their 0.62: they
      # cannot move alone. Remove this once windows 0.100 is out.
      - dependency-name: "windows-core"
        versions: [">= 0.100"]
      - dependency-name: "windows-collections"
        versions: [">= 0.100"]
      - dependency-name: "windows-future"
        versions: [">= 0.100"]
